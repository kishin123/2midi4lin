[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "2midi4lin"
version = "0.2.1"
description = "Piano MIDI toolset: transcribe, post-process, and download piano MIDI"
authors = [{name = "kishin123"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pretty_midi",
    "numpy",
    "onnxruntime",
    "soundfile",
    "pywebview",
    "requests",
    "yt-dlp",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0",
]
all = [
    "torch>=2.0",
    "scipy",
    "tqdm",
]

[project.scripts]
2midi4lin = "src.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
